name: Deploy Web

# Triggered on app code changes or manual run.
# After first run, go to repo Settings → Pages → Source → gh-pages branch to activate the site.
# URL: https://singsingmin.github.io/dugoutpick/
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/pwa-patch.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}           # 미주입 시 웹 화이트스크린(createClient throw)
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }} # anon 키는 공개 안전(RLS 보호), 번들에 박힘
          EXPO_PUBLIC_DEBUG_TOOLS: '1'   # 테스트용 디버그 버튼 노출(공개 전 제거)
          EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}   # 설정 화면에 빌드 표시 → 캐시/최신 여부 즉시 확인
        run: npx expo export --platform web

      - name: Patch PWA
        run: node scripts/pwa-patch.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          enable_jekyll: false
