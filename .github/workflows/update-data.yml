name: Update KBO Data

# KST 기준 하루 여러 번 갱신 (GitHub cron은 UTC).
# 선발투수는 경기 1~2시간 전 등록되므로 오전 + 경기 직전 + 경기 후 시간대를 커버.
on:
  schedule:
    - cron: '0 22 * * *'       # 07:00 KST  (아침 갱신)
    - cron: '0 2 * * *'        # 11:00 KST  (경기 전, 선발 등록)
    # 경기 시간대(14:00~23:50 KST = UTC 05~14시) 백업 갱신 — 주력은 외부 cron(cron-job.org)이 5분 간격으로
    # workflow_dispatch 호출. GitHub schedule은 best-effort라 신뢰 못 하므로, 외부 cron 장애/PAT 만료 시
    # '완전히 깜깜해지는 것'만 막는 30분 폴백으로 둠.
    - cron: '*/30 5-14 * * *'
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

# 이중 트리거(외부 cron + GitHub schedule) 동시 실행 시 git push 충돌 방지.
# cancel-in-progress: false → 겹치면 취소하지 않고 줄 세워 순차 실행.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build data
        run: node data-pipeline/build.mjs

      # 서버 푸시: 경기 시작 임박(20~40분 전) 시 해당 팀 팬에게 발송. 실패해도 데이터 파이프라인 안 깨게 격리.
      - name: Send push notifications
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node data-pipeline/push-notify.mjs

      # 예측 리그: 오늘 예측 마감시각 upsert + dailyHoney 확정 시 pending 예측 정산. 실패해도 격리.
      - name: Sync prediction league
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node data-pipeline/predictions-sync.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/output/*.json
          # build.mjs는 매 실행마다 updatedAt를 새로 쓰므로 항상 diff가 생김.
          # 실데이터 변경 없이 updatedAt만 바뀐 경우는 커밋하지 않음(히스토리 폭증 방지).
          real_changes=$(git diff --staged -U0 -- data-pipeline/output/*.json \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"updatedAt"' || true)
          if [ -z "$real_changes" ]; then
            echo "No real data changes (updatedAt only) — skipping commit."
          else
            git commit -m "chore: update KBO data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
